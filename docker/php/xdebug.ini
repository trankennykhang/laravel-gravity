[xdebug]
; -----------------------------------------------------------------------------
; Xdebug 3 Configuration for Laravel Gravity
; -----------------------------------------------------------------------------

; Core Mode: off, develop, debug, trace, profile, coverage (comma-separated for multiple)
; Can be overridden dynamically via XDEBUG_MODE environment variable
xdebug.mode = off

; Request Triggering:
;   yes     - Activates on every request
;   no      - Only activates via code or CLI
;   trigger - Activates only when trigger parameter/cookie/header is present
;             (e.g., XDEBUG_TRIGGER=1 or browser extension cookie XDEBUG_SESSION=PHPSTORM)
xdebug.start_with_request = trigger
xdebug.trigger_value = ""

; Connection / Client (IDE) Host and Port
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.discover_client_host = 0
xdebug.connect_timeout_ms = 200

; Output and Diagnostic Logging
xdebug.output_dir = /var/www/html/storage/logs/xdebug
xdebug.log = /var/www/html/storage/logs/xdebug/xdebug.log
xdebug.log_level = 0

; Profiling Configuration (xdebug.mode = profile)
; Generates Cachegrind files viewable in PhpStorm, VSCode, KCachegrind, Webgrind, Speedscope
xdebug.profiler_output_name = cachegrind.out.%p.%t
xdebug.profiler_append = 0
xdebug.use_compression = 0

; Tracing Configuration (xdebug.mode = trace)
; Generates execution trace files
xdebug.trace_output_name = trace.%c.%t
xdebug.trace_format = 0
xdebug.trace_options = 1
xdebug.collect_return = 1
xdebug.collect_assignments = 1

; Development Helpers (xdebug.mode = develop)
xdebug.cli_color = 1
xdebug.var_display_max_depth = 10
xdebug.var_display_max_children = 256
xdebug.var_display_max_data = 1024
xdebug.show_error_trace = 1
xdebug.show_exception_trace = 0
