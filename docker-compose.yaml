services:
  # Laravel PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        user: developer
        uid: 1000
    container_name: laravel-gravity-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # OpenTelemetry
      - OTEL_PHP_AUTOLOAD_ENABLED=true
      - OTEL_PHP_TRACE_CLI_ENABLED=true
      - OTEL_SERVICE_NAME=laravel-gravity-app
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # Xdebug configuration (modes: off, develop, debug, trace, profile, coverage)
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-trigger}
      - XDEBUG_IDEKEY=${XDEBUG_IDEKEY:-PHPSTORM}
      - XDEBUG_TRIGGER_VALUE=${XDEBUG_TRIGGER_VALUE:-}
    networks:
      - gravity-network
    depends_on:
      - redis

  # Nginx Web Server Service
  web:
    image: nginx:alpine
    container_name: laravel-gravity-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gravity-network
    depends_on:
      - app

  # MySQL Database Service (Optional if using SQLite)
  db:
    image: mysql:8.0
    container_name: laravel-gravity-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-gravity}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - gravity-mysql-data:/var/lib/mysql
    networks:
      - gravity-network

  # Redis In-Memory Store & Cache
  redis:
    image: redis:alpine
    container_name: laravel-gravity-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - gravity-redis-data:/data
    networks:
      - gravity-network

  # Background Queue Worker
  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: laravel-gravity-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DB_CONNECTION=${DB_CONNECTION:-sqlite}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # OpenTelemetry
      - OTEL_PHP_AUTOLOAD_ENABLED=true
      - OTEL_PHP_TRACE_CLI_ENABLED=true
      - OTEL_SERVICE_NAME=laravel-gravity-queue
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      # Xdebug configuration
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
      - XDEBUG_CONFIG=${XDEBUG_CONFIG:-client_host=host.docker.internal client_port=9003}
      - XDEBUG_START_WITH_REQUEST=${XDEBUG_START_WITH_REQUEST:-trigger}
      - XDEBUG_IDEKEY=${XDEBUG_IDEKEY:-PHPSTORM}
      - XDEBUG_TRIGGER_VALUE=${XDEBUG_TRIGGER_VALUE:-}
    networks:
      - gravity-network
    depends_on:
      - app
      - redis

  # Mailpit Local Email Testing Server
  mailpit:
    image: axllent/mailpit:latest
    container_name: laravel-gravity-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - gravity-network

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: laravel-gravity-otel
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    networks:
      - gravity-network
    depends_on:
      - tempo
      - loki

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: laravel-gravity-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - gravity-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gravity-network

  # Loki
  loki:
    image: grafana/loki:latest
    container_name: laravel-gravity-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - gravity-loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - gravity-network

  # Tempo
  tempo:
    image: grafana/tempo:latest
    container_name: laravel-gravity-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/observability/tempo.yaml:/etc/tempo.yaml:ro
      - gravity-tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
    networks:
      - gravity-network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: laravel-gravity-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./docker/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - gravity-grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - gravity-network
    depends_on:
      - prometheus
      - loki
      - tempo

networks:
  gravity-network:
    driver: bridge

volumes:
  gravity-mysql-data:
    driver: local
  gravity-redis-data:
    driver: local
  gravity-prometheus-data:
    driver: local
  gravity-loki-data:
    driver: local
  gravity-tempo-data:
    driver: local
  gravity-grafana-data:
    driver: local
